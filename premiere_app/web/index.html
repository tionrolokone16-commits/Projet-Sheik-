<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kira's FAT : prendre soin de soi en douceur, à son rythme.">
  <meta name="theme-color" content="#FFF0F5">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kira's FAT">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kira's FAT</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Écran de chargement : il s'affiche immédiatement (simple HTML/CSS),
    pendant que l'application se télécharge (≈ 11 Mo la première fois).
    Il disparaît en fondu dès que l'application est prête
    (voir web/flutter_bootstrap.js).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #FFF0F5; }
    #chargement {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; box-sizing: border-box; text-align: center;
      background: #FFF0F5; color: #2B1620;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    #chargement.fini { opacity: 0; pointer-events: none; }
    #chargement img {
      width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 8px 24px rgba(194, 24, 91, 0.3);
    }
    #chargement .nom { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    #chargement p { margin: 0; max-width: 320px; font-size: 16px; line-height: 1.4; }
    #chargement .discret { color: #6B4D5A; font-size: 15px; }
    #chargement .points { display: flex; gap: 8px; height: 12px; }
    #chargement .points span {
      width: 10px; height: 10px; border-radius: 50%; background: #D01A5E;
      animation: rebond 1.2s ease-in-out infinite;
    }
    #chargement .points span:nth-child(2) { animation-delay: 0.15s; }
    #chargement .points span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes rebond {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    #chargement button {
      font: inherit; font-weight: 700; color: #fff; background: #D01A5E;
      border: 0; border-radius: 999px; padding: 12px 28px;
    }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      html, body, #chargement { background: #241019; color: #FBE9F0; }
      #chargement .discret { color: #D9BCC8; }
      #chargement .points span { background: #F48FB1; }
    }
  </style>
</head>
<body>
  <div id="chargement" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="nom">Kira's FAT</div>
    <div class="points" id="chargement-points"><span></span><span></span><span></span></div>
    <p id="chargement-etat">Chargement…</p>
    <p id="chargement-lent" class="discret" hidden>
      La première ouverture peut prendre jusqu'à une minute.
      Les suivantes seront bien plus rapides 🌸
    </p>
    <p id="chargement-erreur" hidden>
      Le chargement n'a pas abouti. Vérifie ta connexion internet, puis réessaie.
    </p>
    <button id="chargement-reessayer" type="button" hidden onclick="location.reload()">
      Réessayer
    </button>
  </div>
  <script>
    // Si le chargement est long, on rassure (la première fois, c'est normal).
    setTimeout(function () {
      var lent = document.getElementById('chargement-lent');
      var ecran = document.getElementById('chargement');
      if (lent && ecran && !ecran.classList.contains('fini')) lent.hidden = false;
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
